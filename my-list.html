<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nitpliks">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#080808">
    <title>My List - Nitpliks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(180deg,#080808,#111 45%,#080808); color: #f8fafc; }
        :focus-visible { outline: 2px solid #fb3348; outline-offset: 3px; }
        .movie-card { background: #171717; border: 1px solid rgba(255,255,255,.1); transition: transform .2s ease,border-color .2s ease; }
        .movie-card:hover { transform: translateY(-3px); border-color: #fb3348; }
        .compact-cards #myListGrid { grid-template-columns: repeat(auto-fill,minmax(145px,1fr)); }
        @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="site-redesign.css">
    <style>
        .my-list-page main {
            padding-top: 2rem !important;
        }
        .my-list-page .my-list-hero {
            position: relative;
            overflow: hidden;
            display: block;
            padding: 2.25rem !important;
            border: 1px solid rgba(148, 163, 184, .18) !important;
            border-radius: 1.4rem !important;
            background:
                radial-gradient(circle at 88% 0, rgba(103, 232, 249, .14), transparent 18rem),
                linear-gradient(135deg, rgba(15, 23, 42, .94), rgba(8, 15, 31, .9)) !important;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .24) !important;
        }
        .my-list-page .my-list-hero::after {
            content: "";
            position: absolute;
            right: 7%;
            bottom: -5rem;
            width: 13rem;
            height: 13rem;
            border: 1px solid rgba(103, 232, 249, .18);
            border-radius: 50%;
            box-shadow: 0 0 0 1.5rem rgba(103, 232, 249, .035), 0 0 0 3rem rgba(103, 232, 249, .02);
            pointer-events: none;
        }
        .my-list-page .my-list-hero > * {
            position: relative;
            z-index: 1;
        }
        .my-list-page .my-list-hero h1 {
            max-width: none;
            font-size: clamp(2.8rem, 7vw, 5.4rem) !important;
            line-height: .95;
        }
        .my-list-page .my-list-controls {
            display: grid;
            grid-template-columns: minmax(12rem, 1.35fr) minmax(8rem, .8fr) minmax(10rem, 1fr);
            width: min(100%, 31rem);
            gap: .55rem;
        }
        .my-list-page .my-list-controls input,
        .my-list-page .my-list-controls select {
            width: 100%;
            min-width: 0;
        }
        @media (max-width: 767px) {
            .my-list-page main {
                padding-top: 1.25rem !important;
            }
            .my-list-page .my-list-hero {
                padding: 1.25rem !important;
                border-radius: 1rem !important;
            }
            .my-list-page .my-list-controls {
                grid-template-columns: 1fr 1fr;
                width: 100%;
            }
            .my-list-page .my-list-controls input {
                grid-column: 1 / -1;
            }
        }
        @media (max-width: 420px) {
            .my-list-page .my-list-controls {
                grid-template-columns: 1fr;
            }
            .my-list-page .my-list-controls input {
                grid-column: auto;
            }
        }
    </style>
    <script src="profile-storage.js"></script>
    <script src="details-modal.js?v=2" defer></script>
    <script src="sync.js"></script>
</head>
<body class="my-list-page">
    <nav class="sticky top-0 z-10 border-b border-white/10 bg-black/90 backdrop-blur-xl">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6">
            <a href="index.html" class="flex items-center gap-2.5 text-sm font-extrabold text-white">
                <img class="site-logo" src="nitpliks-logo.png?v=40" width="160" height="53" alt="Nitpliks home">
            </a>
            <div class="flex min-w-0 max-w-[55vw] gap-3 overflow-x-auto whitespace-nowrap text-xs font-bold text-slate-400"><a href="search-results.html" class="hover:text-white">Search</a><a href="release-calendar.html" class="hover:text-white">Releases</a><a href="my-ratings.html" class="hover:text-white">Ratings</a><a href="index.html" class="hover:text-white">Discover</a></div>
        </div>
    </nav>
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-10 sm:px-6 sm:py-14">
        <header class="my-list-hero mb-8">
            <p class="mb-2 text-[10px] font-black uppercase tracking-[.3em] text-rose-300">Your saved collection</p>
            <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <h1 class="text-3xl font-black tracking-tight sm:text-5xl">My List</h1>
                    <p class="mt-2 text-sm text-slate-400">Keep the stories you want to watch next.</p>
                </div>
                <div class="my-list-controls">
                    <label class="sr-only" for="listSearch">Search My List</label>
                    <input id="listSearch" type="search" placeholder="Search your list" class="min-h-11 rounded-xl border border-white/10 bg-neutral-900 px-3 text-xs text-white placeholder:text-slate-500 focus:border-rose-500 focus:outline-none">
                    <label class="sr-only" for="typeFilter">Filter by type</label>
                    <select id="typeFilter" class="min-h-11 rounded-xl border border-white/10 bg-neutral-900 px-3 text-xs text-white focus:border-rose-500 focus:outline-none">
                        <option value="all">All titles</option>
                        <option value="movie">Movies</option>
                        <option value="tv">Series</option>
                    </select>
                    <label class="sr-only" for="sortFilter">Sort saved titles</label>
                    <select id="sortFilter" class="min-h-11 rounded-xl border border-white/10 bg-neutral-900 px-3 text-xs text-white focus:border-rose-500 focus:outline-none">
                        <option value="recent">Recently added</option>
                        <option value="title">Title A-Z</option>
                        <option value="rating">Highest rated</option>
                    </select>
                </div>
            </div>
            <p id="listCount" class="mt-4 text-xs font-bold text-slate-500" aria-live="polite"></p>
        </header>
        <div id="emptyState" class="hidden rounded-2xl border border-white/10 bg-white/5 px-5 py-12 text-center">
            <h2 class="text-lg font-extrabold">Your list is empty</h2>
            <p class="mt-2 text-sm text-slate-400">Browse the catalog and add titles you want to watch.</p>
            <a href="index.html" class="mt-5 inline-flex rounded-xl bg-rose-700 px-5 py-3 text-xs font-extrabold uppercase tracking-wide hover:bg-rose-600">Explore titles</a>
        </div>
        <div id="myListGrid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-5 lg:grid-cols-4 xl:grid-cols-5" aria-live="polite"></div>
        <p id="noMatches" class="hidden rounded-xl border border-white/10 bg-white/5 px-5 py-8 text-center text-sm text-slate-400">No saved titles match those filters.</p>
    </main>
    <script>
        const WATCHLIST_KEY = 'clique_watchlist';
        const grid = document.getElementById('myListGrid');
        const searchInput = document.getElementById('listSearch');
        const typeFilter = document.getElementById('typeFilter');
        const sortFilter = document.getElementById('sortFilter');

        function readWatchlist() {
            try {
                const list = JSON.parse(localStorage.getItem(WATCHLIST_KEY) || '[]');
                return Array.isArray(list) ? list.filter(item => item && item.id && item.title) : [];
            } catch (error) {
                console.error('Unable to read the saved list:', error);
                return [];
            }
        }

        function safeImageSource(value) {
            try {
                const url = new URL(value || '', window.location.href);
                return url.protocol === 'https:' ? url.href : 'https://placehold.co/500x750/171717/ffffff?text=No+Poster';
            } catch {
                return 'https://placehold.co/500x750/171717/ffffff?text=No+Poster';
            }
        }

        function renderList() {
            const allItems = readWatchlist();
            const query = searchInput.value.trim().toLocaleLowerCase();
            const type = typeFilter.value;
            const items = allItems.filter(item =>
                (type === 'all' || item.type === type) &&
                item.title.toLocaleLowerCase().includes(query)
            );
            items.sort((a, b) => sortFilter.value === 'title'
                ? a.title.localeCompare(b.title)
                : sortFilter.value === 'rating'
                    ? Number(b.rating || 0) - Number(a.rating || 0)
                    : Number(b.addedAt || 0) - Number(a.addedAt || 0));
            document.getElementById('listCount').textContent = `${items.length} of ${allItems.length} saved ${allItems.length === 1 ? 'title' : 'titles'}`;
            document.getElementById('emptyState').classList.toggle('hidden', allItems.length > 0);
            document.getElementById('noMatches').classList.toggle('hidden', items.length > 0 || allItems.length === 0);
            grid.replaceChildren(...items.map(item => {
                const card = document.createElement('article');
                card.className = 'movie-card overflow-hidden rounded-2xl';
                const link = document.createElement('a');
                link.href = `index.html?details=${encodeURIComponent(item.id)}&type=${item.type === 'tv' ? 'tv' : 'movie'}&anime=${item.isAnime ? 1 : 0}`;
                link.className = 'block focus-visible:outline';
                link.setAttribute('aria-label', `Watch ${item.title}`);
                const image = document.createElement('img');
                image.className = 'aspect-[2/3] w-full bg-neutral-900 object-cover';
                image.src = safeImageSource(item.image);
                image.alt = `${item.title} poster`;
                image.loading = 'lazy';
                const title = document.createElement('h2');
                title.className = 'truncate px-3 pt-3 text-xs font-extrabold';
                title.textContent = item.title;
                const meta = document.createElement('p');
                meta.className = 'px-3 pb-3 pt-1 text-[10px] uppercase text-slate-500';
                meta.textContent = item.type === 'tv' ? 'Series' : 'Movie';
                link.append(image, title, meta);
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'm-3 mt-0 rounded-lg border border-white/10 px-3 py-2 text-[10px] font-bold text-slate-300 hover:border-rose-500 hover:text-white';
                remove.textContent = 'Remove from My List';
                remove.setAttribute('aria-label', `Remove ${item.title} from My List`);
                remove.addEventListener('click', () => {
                    const updated = readWatchlist().filter(saved => String(saved.id) !== String(item.id));
                    localStorage.setItem(WATCHLIST_KEY, JSON.stringify(updated));
                    renderList();
                });
                card.append(link, remove);
                return card;
            }));
        }

        searchInput.addEventListener('input', renderList);
        typeFilter.addEventListener('change', renderList);
        sortFilter.addEventListener('change', renderList);
        window.addEventListener('storage', event => {
            if (event.key === WATCHLIST_KEY) renderList();
        });
        window.addEventListener('clique-library-synced', renderList);
        if (localStorage.getItem('clique_compact_cards') === 'true') document.body.classList.add('compact-cards');
        renderList();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js?v=48').catch(error => {
                    console.error('Service worker registration failed:', error);
                });
            });
        }
    </script>
    <script src="visitor-log.js?v=2"></script>
</body>
</html>
