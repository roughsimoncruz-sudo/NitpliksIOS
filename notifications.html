<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - Nitpliks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="site-redesign.css">
</head>
<body>
    <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-10">
        <a href="index.html" class="inline-flex min-h-10 items-center text-xs font-bold text-cyan-200">← Discover</a>
        <header class="mt-7 sm:mt-8"><p class="text-[10px] font-black uppercase tracking-[.3em] text-cyan-200">Your account</p><h1 class="mt-2 text-4xl font-black">Notifications</h1></header>
        <p id="status" class="mt-5 text-sm text-slate-400" role="status"></p>
        <div id="notifications" class="mt-5 space-y-3"></div>
    </main>
    <script>
        let csrfToken='';
        function renderLocalNotifications() {
            try {
                const items = JSON.parse(localStorage.getItem('clique_notifications') || '[]');
                if (!Array.isArray(items) || !items.length) return false;
                const root = document.getElementById('notifications');
                document.getElementById('status').textContent = `${items.length} notification${items.length === 1 ? '' : 's'}`;
                root.replaceChildren(...items.map(item => {
                    const card = document.createElement('article');
                    card.className = `glass-panel rounded-xl p-4 ${item.read ? 'opacity-60' : ''}`;
                    const title = document.createElement('h2'); title.textContent = item.title || 'Notification'; title.className = 'font-extrabold';
                    const message = document.createElement('p'); message.textContent = item.message || ''; message.className = 'mt-1 text-sm text-slate-400';
                    card.append(title, message);
                    card.addEventListener('click', () => {
                        item.read = true;
                        localStorage.setItem('clique_notifications', JSON.stringify(items));
                        card.classList.add('opacity-60');
                    });
                    return card;
                }));
                return true;
            } catch (error) { console.error('Unable to read local notifications:', error); return false; }
        }
        renderLocalNotifications();
        fetch('auth.php?action=me',{credentials:'same-origin'}).then(response=>response.json()).then(result=>{csrfToken=result.csrf_token||'';});
        fetch('features.php?action=notifications', {credentials:'same-origin'}).then(async response => { const result=await response.json(); if(!response.ok) throw new Error(result.error || 'Sign in required.'); const root=document.getElementById('notifications'); document.getElementById('status').textContent=`${result.items.length} notification${result.items.length===1?'':'s'}`; root.replaceChildren(...result.items.map(item => { const card=document.createElement('article'); card.className=`glass-panel rounded-xl p-4 ${Number(item.is_read) ? 'opacity-60' : ''}`; const title=document.createElement('h2'); title.textContent=item.title; title.className='font-extrabold'; const message=document.createElement('p'); message.textContent=item.message; message.className='mt-1 text-sm text-slate-400'; card.append(title,message); if(item.link){const link=document.createElement('a');link.href=item.link;link.textContent='View title';link.className='mt-3 inline-block text-xs font-bold text-cyan-200';card.append(link);} if(!Number(item.is_read)){card.addEventListener('click',()=>fetch('features.php?action=read-notification',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({id:item.id})}));} return card;})); }).catch(error=>{if(!renderLocalNotifications()) document.getElementById('status').textContent=error.message;});
    </script>
    <script src="visitor-log.js?v=2"></script>
</body>
</html>
