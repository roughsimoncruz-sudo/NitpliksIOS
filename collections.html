<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nitpliks">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#080808">
    <title>Collections - Nitpliks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box; }
        body { min-height:100vh;background:linear-gradient(180deg,#080808,#111 45%,#080808);color:#f8fafc; }
        :focus-visible { outline:2px solid #fb3348;outline-offset:3px; }
        .card { background:#171717;border:1px solid rgba(255,255,255,.1);transition:transform .2s ease,border-color .2s ease; }
        .card:hover { transform:translateY(-3px);border-color:#fb3348; }
    </style>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="site-redesign.css">
    <script src="profile-storage.js"></script>
    <script src="details-modal.js?v=2" defer></script>
    <script src="sync.js"></script>
</head>
<body>
    <nav class="sticky top-0 z-10 border-b border-white/10 bg-black/90 backdrop-blur-xl">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6">
            <a href="index.html" class="flex items-center gap-2.5 text-sm font-extrabold"><img class="site-logo" src="nitpliks-logo.png?v=40" width="160" height="53" alt="Nitpliks home"></a>
            <div class="flex gap-4 text-xs font-bold text-slate-400"><a href="search-results.html" class="hover:text-white">Search</a><a href="release-calendar.html" class="hover:text-white">Releases</a><a href="my-list.html" class="hover:text-white">My List</a></div>
        </div>
    </nav>
    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6">
        <header class="mb-7"><p id="eyebrow" class="mb-2 text-[10px] font-black uppercase tracking-[.3em] text-rose-300">Explore a collection</p><h1 id="title" class="text-3xl font-black sm:text-5xl">Collections</h1><p id="description" class="mt-2 text-sm text-slate-400"></p></header>
        <nav class="mb-6 flex gap-2 overflow-x-auto" aria-label="Collections">
            <a href="?type=dc" class="rounded-lg border border-white/10 px-3 py-2 text-xs font-bold hover:border-rose-500">DC</a>
            <a href="?type=documentary" class="rounded-lg border border-white/10 px-3 py-2 text-xs font-bold hover:border-rose-500">Documentaries</a>
            <a href="?type=animation" class="rounded-lg border border-white/10 px-3 py-2 text-xs font-bold hover:border-rose-500">Animation</a>
            <a href="?type=classics" class="rounded-lg border border-white/10 px-3 py-2 text-xs font-bold hover:border-rose-500">Classics</a>
        </nav>
        <section class="mb-6 flex flex-wrap items-end gap-3 rounded-2xl border border-white/10 bg-white/5 p-4" aria-label="Collection filters">
            <label class="grid gap-1 text-[10px] font-bold uppercase text-slate-400">Sort
                <select id="sort" class="min-h-10 rounded-lg border border-white/10 bg-neutral-900 px-3 text-xs normal-case text-white"><option value="popularity.desc">Popularity</option><option value="vote_average.desc">Highest rated</option><option value="primary_release_date.desc">Newest</option><option value="primary_release_date.asc">Oldest</option></select>
            </label>
            <label class="grid gap-1 text-[10px] font-bold uppercase text-slate-400">Year
                <select id="year" class="min-h-10 rounded-lg border border-white/10 bg-neutral-900 px-3 text-xs normal-case text-white"><option value="">Any year</option></select>
            </label>
            <label class="grid gap-1 text-[10px] font-bold uppercase text-slate-400">Genre
                <select id="genre" class="min-h-10 rounded-lg border border-white/10 bg-neutral-900 px-3 text-xs normal-case text-white"><option value="">Any genre</option><option value="28">Action</option><option value="12">Adventure</option><option value="16">Animation</option><option value="35">Comedy</option><option value="18">Drama</option><option value="27">Horror</option><option value="878">Sci-Fi</option><option value="53">Thriller</option><option value="99">Documentary</option></select>
            </label>
        </section>
        <p id="status" role="status" aria-live="polite" class="mb-4 text-sm text-slate-400"></p>
        <div id="grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div>
        <nav id="pagination" class="mt-8 hidden items-center justify-center gap-4"><button id="prev" class="rounded-lg border border-white/10 px-4 py-2 text-xs font-bold disabled:opacity-40">Previous</button><span id="pageLabel" class="text-xs text-slate-400"></span><button id="next" class="rounded-lg border border-white/10 px-4 py-2 text-xs font-bold disabled:opacity-40">Next</button></nav>
    </main>
    <script>
        const API_KEY='295a780c3e5aae731d6f2e804c6d13e5';
        const API='https://api.themoviedb.org/3';
        const IMAGE='https://image.tmdb.org/t/p/w500';
        const configurations={
            dc:{title:'DC Stories',description:'Explore heroes, villains, and worlds across DC films.',genre:'',companies:'429'},
            documentary:{title:'Documentaries',description:'Real stories, discoveries, and perspectives.',genre:'99'},
            animation:{title:'Animation',description:'Animated stories for every kind of viewer.',genre:'16'},
            classics:{title:'Classic Movies',description:'Discover films released before 2000.',before:'1999-12-31'}
        };
        const params=new URLSearchParams(location.search);
        const kind=params.get('type') in configurations ? params.get('type') : 'dc';
        const config=configurations[kind];
        let page=1,totalPages=1,requestId=0;
        document.getElementById('title').textContent=config.title;
        document.getElementById('description').textContent=config.description;
        document.title=`${config.title} - Nitpliks`;
        for(let year=new Date().getFullYear();year>=1900;year--) document.getElementById('year').add(new Option(String(year),String(year)));
        for(const [id,key] of [['sort','sort'],['year','year'],['genre','genre']]) if(params.has(key)) document.getElementById(id).value=params.get(key);
        page=Math.max(1,Number(params.get('page'))||1);
        async function load(nextPage=1) {
            const thisRequest=++requestId;
            page=nextPage;
            const query=new URLSearchParams({api_key:API_KEY,page:String(page),sort_by:document.getElementById('sort').value,include_adult:'false'});
            const genre=document.getElementById('genre').value||config.genre;
            if(genre) query.set('with_genres',genre);
            if(config.companies) query.set('with_companies',config.companies);
            if(config.before) query.set('primary_release_date.lte',config.before);
            const year=document.getElementById('year').value;
            if(year){query.set('primary_release_date.gte',`${year}-01-01`);query.set('primary_release_date.lte',`${year}-12-31`);}
            document.getElementById('status').textContent='Loading titles…';
            try{
                const response=await fetch(`${API}/discover/movie?${query}`);
                if(!response.ok) throw new Error(`Catalog returned ${response.status}`);
                const data=await response.json();
                if(thisRequest!==requestId)return;
                totalPages=Math.min(500,data.total_pages||1);
                document.getElementById('status').textContent=`${Number(data.total_results||0).toLocaleString()} titles`;
                document.getElementById('grid').replaceChildren(...(data.results||[]).map(movie=>{
                    const card=document.createElement('article');card.className='card relative overflow-hidden rounded-xl';
                    const link=document.createElement('a');link.className='block';link.href=`index.html?details=${encodeURIComponent(movie.id)}&type=movie&anime=0`;
                    const image=document.createElement('img');image.className='aspect-[2/3] w-full bg-neutral-900 object-cover';image.loading='lazy';image.alt=`${movie.title||'Movie'} poster`;image.src=movie.poster_path?`${IMAGE}${movie.poster_path}`:'https://placehold.co/500x750/171717/ffffff?text=No+Poster';
                    const title=document.createElement('h2');title.className='truncate px-3 pt-3 text-xs font-extrabold';title.textContent=movie.title||'Untitled';
                    const meta=document.createElement('p');meta.className='px-3 py-1 text-[10px] text-slate-400';meta.textContent=`${(movie.release_date||'').slice(0,4)||'Year unknown'} · ★ ${Number(movie.vote_average||0).toFixed(1)}`;
                    link.append(image,title,meta);
                    const button=document.createElement('button');button.type='button';button.className='m-3 mt-2 rounded-lg border border-white/10 px-3 py-2 text-[10px] font-bold hover:border-rose-500';button.textContent='＋ My List';button.setAttribute('aria-label',`Add ${movie.title} to My List`);
                    button.addEventListener('click',()=>{let list=[];try{list=JSON.parse(localStorage.getItem('clique_watchlist')||'[]');if(!Array.isArray(list))list=[];}catch(error){console.error('Unable to read My List:',error);}const index=list.findIndex(item=>String(item.id)===String(movie.id));if(index>=0){list.splice(index,1);button.textContent='＋ My List';}else{list.push({id:String(movie.id),title:movie.title||'Untitled',image:movie.poster_path?`${IMAGE}${movie.poster_path}`:'',type:'movie',isAnime:false});button.textContent='Saved';}localStorage.setItem('clique_watchlist',JSON.stringify(list));});
                    card.append(link,button);return card;
                }));
                document.getElementById('pagination').classList.toggle('hidden',totalPages<=1);
                document.getElementById('pagination').classList.toggle('flex',totalPages>1);
                document.getElementById('pageLabel').textContent=`Page ${page} of ${totalPages}`;
                document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=totalPages;
                const current=new URLSearchParams(location.search);current.set('type',kind);current.set('page',String(page));current.set('sort',document.getElementById('sort').value);current.set('year',year);current.set('genre',document.getElementById('genre').value);history.replaceState(null,'',`?${current}`);
            }catch(error){if(thisRequest!==requestId)return;console.error('Unable to load collection:',error);document.getElementById('status').textContent='Could not load this collection. Check your connection and try again.';}
        }
        ['sort','year','genre'].forEach(id=>document.getElementById(id).addEventListener('change',()=>load(1)));
        document.getElementById('prev').addEventListener('click',()=>load(page-1));
        document.getElementById('next').addEventListener('click',()=>load(page+1));
        load(page);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js?v=48').catch(error => {
                    console.error('Service worker registration failed:', error);
                });
            });
        }
    </script>
    <script src="visitor-log.js?v=2"></script>
</body>
</html>
