workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Ensure www folder exists
        script: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Nitpliks</title></head><body>Loading...</body></html>' > www/index.html
          fi
      - name: Add iOS platform if missing
        script: |
          if [ ! -d ios/App/App.xcodeproj ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Block player pop-ups in iOS
        script: cp native/ios-capacitor/SceneDelegate.swift ios/App/App/SceneDelegate.swift
      - name: Hide iOS status bar
        script: |
          /usr/libexec/PlistBuddy \
            -c "Set :UIViewControllerBasedStatusBarAppearance false" \
            ios/App/App/Info.plist
          /usr/libexec/PlistBuddy \
            -c "Add :UIStatusBarHidden bool true" \
            ios/App/App/Info.plist
      - name: Set iOS app icon
        script: |
          cp ios-app-icon.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Build unsigned IPA for Sideloadly
        script: |
          xcodebuild \
            -project "ios/App/App.xcodeproj" \
            -scheme "App" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build/ios/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p "ios/App/build/ios/ipa/Payload"
          cp -R "build/ios/DerivedData/Build/Products/Release-iphoneos/App.app" \
            "ios/App/build/ios/ipa/Payload/App.app"
          (cd "ios/App/build/ios/ipa" && /usr/bin/zip -r App.ipa Payload)
    artifacts:
      - ios/App/build/ios/ipa/*.ipa