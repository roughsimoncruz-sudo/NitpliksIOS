<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nitpliks">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#080808">
    <title>My Ratings - Nitpliks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box}
        body{min-height:100vh;background:linear-gradient(180deg,#080808,#111 45%,#080808);color:#f8fafc}
        :focus-visible{outline:2px solid #fb3348;outline-offset:3px}
        .review-card{background:#171717;border:1px solid rgba(255,255,255,.1)}
    </style>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="site-redesign.css">
    <script src="details-modal.js?v=2" defer></script>
    <script src="sync.js"></script>
</head>
<body>
    <nav class="sticky top-0 z-10 border-b border-white/10 bg-black/90 backdrop-blur-xl"><div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6"><a href="index.html" class="flex items-center gap-2.5 text-sm font-extrabold"><img class="site-logo" src="nitpliks-logo.png?v=40" width="160" height="53" alt="Nitpliks home"></a><a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white">Discover</a></div></nav>
    <main class="mx-auto max-w-5xl px-4 py-10 sm:px-6">
        <header class="mb-8"><p class="mb-2 text-[10px] font-black uppercase tracking-[.3em] text-rose-300">Your private journal</p><h1 class="text-3xl font-black sm:text-5xl">My Ratings & Notes</h1><p class="mt-2 text-sm text-slate-400">Saved only in this browser.</p></header>
        <p id="count" class="mb-4 text-xs font-bold text-slate-500" aria-live="polite"></p>
        <div id="empty" class="hidden rounded-2xl border border-white/10 bg-white/5 px-5 py-12 text-center"><h2 class="text-lg font-extrabold">No ratings yet</h2><p class="mt-2 text-sm text-slate-400">Rate a movie or series from its watch page to start your journal.</p><a href="index.html" class="mt-5 inline-flex rounded-xl bg-rose-700 px-5 py-3 text-xs font-extrabold uppercase hover:bg-rose-600">Explore titles</a></div>
        <div id="reviews" class="space-y-3"></div>
    </main>
    <script>
        const KEY='clique_reviews';
        function readReviews(){try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(value)?value.filter(item=>item&&item.id&&item.title):[];}catch(error){console.error('Unable to read ratings:',error);return[];}}
        function render(){
            const items=readReviews().sort((a,b)=>Number(b.updatedAt||0)-Number(a.updatedAt||0));
            document.getElementById('count').textContent=`${items.length} ${items.length===1?'rating':'ratings'}`;
            document.getElementById('empty').classList.toggle('hidden',items.length>0);
            document.getElementById('reviews').replaceChildren(...items.map(item=>{
                const card=document.createElement('article');card.className='review-card flex flex-col gap-4 rounded-xl p-4 sm:flex-row';
                const link=document.createElement('a');link.href=`index.html?details=${encodeURIComponent(item.id)}&type=${item.type==='tv'?'tv':'movie'}&anime=${item.isAnime?1:0}`;link.className='flex min-w-0 flex-1 gap-3';
                const image=document.createElement('img');image.className='h-28 w-20 flex-shrink-0 rounded-lg bg-neutral-900 object-cover';image.src=item.image||'https://placehold.co/240x360/171717/ffffff?text=No+Poster';image.alt=`${item.title} poster`;image.loading='lazy';
                const details=document.createElement('div');details.className='min-w-0';
                const title=document.createElement('h2');title.className='truncate text-sm font-extrabold';title.textContent=item.title;
                const rating=document.createElement('p');rating.className='mt-1 text-xs font-bold text-amber-300';rating.textContent=`${'★'.repeat(Math.max(0,Math.min(5,Number(item.rating)||0)))}${'☆'.repeat(5-Math.max(0,Math.min(5,Number(item.rating)||0)))} · ${Number(item.rating)||0}/5`;
                const note=document.createElement('p');note.className='mt-2 whitespace-pre-wrap break-words text-xs leading-relaxed text-slate-400';note.textContent=item.note||'No note added.';
                details.append(title,rating,note);link.append(image,details);
                const remove=document.createElement('button');remove.type='button';remove.className='self-start rounded-lg border border-white/10 px-3 py-2 text-[10px] font-bold text-slate-300 hover:border-rose-500';remove.textContent='Delete';remove.setAttribute('aria-label',`Delete rating for ${item.title}`);remove.addEventListener('click',()=>{localStorage.setItem(KEY,JSON.stringify(readReviews().filter(review=>String(review.id)!==String(item.id))));render();});
                card.append(link,remove);return card;
            }));
        }
        window.addEventListener('storage',event=>{if(event.key===KEY)render();});
        window.addEventListener('clique-library-synced',render);
        render();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js?v=48').catch(error => {
                    console.error('Service worker registration failed:', error);
                });
            });
        }
    </script>
    <script src="visitor-log.js?v=2"></script>
</body>
</html>
