<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password reset - Nitpliks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="site-redesign.css">
</head>
<body>
    <main class="mx-auto max-w-md px-4 py-12">
        <a href="index.html" class="text-xs font-bold text-cyan-200">← Discover</a>
        <section class="glass-panel mt-8 rounded-2xl p-5">
            <p class="text-[10px] font-black uppercase tracking-[.3em] text-cyan-200">Account recovery</p>
            <h1 class="mt-2 text-3xl font-black">Set a new password</h1>
            <p id="status" class="mt-3 min-h-5 text-sm text-slate-400" role="status"></p>
            <form id="resetForm" class="mt-5 grid gap-3">
                <input id="newPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password" class="min-h-11 rounded-lg border px-3 text-sm" placeholder="New password">
                <input id="confirmPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password" class="min-h-11 rounded-lg border px-3 text-sm" placeholder="Confirm new password">
                <button class="rounded-lg bg-cyan-300 px-5 py-3 text-xs font-black uppercase text-slate-950">Reset password</button>
            </form>
        </section>
    </main>
    <script>
        let csrfToken = '';
        const status = document.getElementById('status');
        fetch('auth.php?action=me', {credentials: 'same-origin'})
            .then(response => response.json())
            .then(result => { csrfToken = result.csrf_token || ''; })
            .catch(error => { console.error('Unable to load reset security token:', error); status.textContent = 'Unable to load the reset form.'; });
        document.getElementById('resetForm').addEventListener('submit', async event => {
            event.preventDefault();
            const password = document.getElementById('newPassword').value;
            if (password !== document.getElementById('confirmPassword').value) {
                status.textContent = 'Passwords do not match.';
                return;
            }
            try {
                const response = await fetch('auth.php?action=reset', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken},
                    body: JSON.stringify({token: new URLSearchParams(location.search).get('token') || '', password})
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Unable to reset password.');
                status.textContent = result.message;
                event.target.reset();
            } catch (error) {
                status.textContent = error.message;
            }
        });
    </script>
</body>
</html>
